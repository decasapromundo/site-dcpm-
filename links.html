<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>De Casa Pro Mundo | Links</title>
  <meta name="description" content="Links da De Casa Pro Mundo: comunidade, site, Instagram e YouTube.">
  <link rel="stylesheet" href="styles.css">
  <style>
    .links-pagina { min-height: 100vh; padding: 56px 0; text-align: center; }
    .links-perfil { display: grid; gap: 12px; justify-items: center; }
    .links-avatar {
      width: 96px; height: 96px; border-radius: 50%;
      background: linear-gradient(135deg, var(--azul), var(--azul-escuro));
      border: 2px solid var(--dourado);
      overflow: hidden; margin-bottom: 8px;
    }
    .links-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .links-lista { display: grid; gap: 14px; width: 100%; max-width: 480px; margin-top: 28px; }
    .links-lista .btn { width: 100%; padding: 16px; }
    .links-lista .btn-secundario { background: var(--cor-card); }
  </style>
</head>
<body>
  <main class="links-pagina">
    <div class="container links-perfil">
      <div class="links-avatar revelar">
        <!-- Troque por sua foto: salve como assets/avatar.jpg e descomente
        <img src="assets/avatar.jpg" alt="Augusto"> -->
      </div>
      <h1 class="revelar">De Casa Pro Mundo</h1>
      <p class="lead revelar">Consultorias para o seu próximo passo.</p>

      <nav class="links-lista">
        <a class="btn revelar" href="https://chat.whatsapp.com/Bi3MbKGpIfNGZDUbN3tDYm" target="_blank" rel="noopener">Entrar na Comunidade Oficial</a>
        <a class="btn btn-secundario revelar" href="index.html">Conheça a De Casa Pro Mundo</a>
        <a class="btn btn-secundario revelar" href="https://www.instagram.com/decasa.promundo/" target="_blank" rel="noopener">Instagram</a>
        <a class="btn btn-secundario revelar" href="https://youtube.com.br/decasapromundo" target="_blank" rel="noopener">YouTube</a>
      </nav>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
